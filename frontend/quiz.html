<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Quiz Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="quiz-wrapper">
        <header class="quiz-header">
            <div class="quiz-title-row">
                <h1 class="quiz-title">Pipeline Quiz Workspace</h1>
                <div class="score-container" id="score-container">
                    <span class="score-text">Score</span>
                    <span class="score-val" id="score-val">0 / 0</span>
                </div>
            </div>
            <div class="quiz-stats">
                <span class="stat-chip" id="stat-mcq">Single Choice (MCQ): 0</span>
                <span class="stat-chip" id="stat-multi">Multiple Choice: 0</span>
                <span class="stat-chip" id="stat-blank">Fill in Blank: 0</span>
            </div>
        </header>

        <main id="questions-container">
            <div style="display: flex; justify-content: center; padding: 40px;">
                <span class="stat-chip">Loading questions...</span>
            </div>
        </main>

        <footer class="actions-row">
            <button class="btn btn-primary" id="submit-btn" onclick="submitQuiz()" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
                </svg>
                Submit Answers
            </button>
            <button class="btn btn-secondary" id="reset-btn" onclick="resetQuiz()" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                Try Again
            </button>
        </footer>
    </div>

    <script src="quiz.js" defer></script>
</body>
</html>
